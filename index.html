<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e8"><title>中3歴史 中間テスト特訓</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#fff8e8;color:#252525}
.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.sub{color:#777;font-size:13px;margin-top:3px}
.card{background:white;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0000000d}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat div{text-align:center;background:#fff4ce;border-radius:15px;padding:12px 5px}.stat b{display:block;font-size:22px}
h2{font-size:17px;margin:20px 0 9px}.units{display:grid;gap:8px}.unit{border:2px solid #eee;background:#fff;border-radius:14px;padding:12px;text-align:left;font-weight:700}.unit.on{border-color:#e9a900;background:#fff7d8}
.row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:0;border-radius:999px;padding:10px 14px;background:#eee;font-weight:700}.pill.on{background:#222;color:white}
.primary{width:100%;border:0;background:#f2b705;border-radius:16px;padding:16px;font-size:18px;font-weight:900;margin-top:16px}.secondary{width:100%;border:0;background:#222;color:white;border-radius:16px;padding:14px;font-weight:800;margin-top:9px}
.hidden{display:none}.progress{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:#f2b705}.qnum{color:#777;font-size:13px}.question{font-size:21px;font-weight:850;line-height:1.55;margin:15px 0 20px}
.choice{width:100%;text-align:left;border:2px solid #eee;background:white;border-radius:14px;padding:14px;margin:6px 0;font-size:16px}.choice.correct{border-color:#29a65a;background:#edfff3}.choice.wrong{border-color:#e25050;background:#fff0f0}
.result{font-size:18px;font-weight:900;margin-top:14px}.answer{padding:12px;border-radius:12px;background:#f5f5f5;margin-top:8px}.actions{display:flex;gap:8px}.actions button{flex:1}.star{border:0;background:#fff1b5;border-radius:12px;padding:10px;font-weight:800}.tiny{font-size:12px;color:#777}.danger{background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px;color:#777}
</style></head><body><main class="app">
<section id="home">
<div class="head"><div><div class="logo">🏯 歴史特訓</div><div class="sub">中3・中間テスト対策</div></div><button class="danger" onclick="resetData()">記録リセット</button></div>
<div class="card stat"><div><b id="done">0</b><span>解答数</span></div><div><b id="rate">--</b><span>正答率</span></div><div><b id="weak">0</b><span>苦手</span></div></div>
<h2>① 範囲を選ぶ</h2><div id="units" class="units"></div>
<h2>② 学習モード</h2><div class="row">
<button class="pill on" data-mode="normal" onclick="mode(this)">選択範囲</button>
<button class="pill" data-mode="weak" onclick="mode(this)">苦手だけ</button>
<button class="pill" data-mode="star" onclick="mode(this)">⭐だけ</button></div>
<h2>③ 問題数</h2><div class="row">
<button class="pill on count" data-count="10" onclick="count(this)">10問</button>
<button class="pill count" data-count="20" onclick="count(this)">20問</button>
<button class="pill count" data-count="999" onclick="count(this)">全部</button></div>
<button class="primary" onclick="start()">スタート</button>
<div class="card tiny">間違えた問題は自動で「苦手」に登録されます。正解を重ねると苦手から外れます。⭐を付けた問題だけの復習もできます。学習記録はこの端末に保存されます。</div>
</section>
<section id="quiz" class="hidden">
<div class="head"><button class="danger" onclick="goHome()">← 終了</button><div id="unitLabel" class="tiny"></div></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="qnum" class="qnum"></div>
<div id="question" class="question"></div><div id="choices"></div>
<div id="feedback" class="hidden"><div id="result" class="result"></div><div id="answer" class="answer"></div>
<div class="actions"><button id="starBtn" class="star" onclick="toggleStar()">☆ あとで復習</button><button class="secondary" onclick="next()">次の問題 →</button></div></div>
</section>
<section id="finish" class="hidden"><div class="card" style="text-align:center"><div style="font-size:50px">🎉</div><h1>おつかれさま！</h1><p id="finishText"></p><button class="primary" onclick="goHome()">トップへ戻る</button></div></section>
</main>
<script>

const units=[...new Set(Q.map(x=>x.unit))]; let selected=new Set(units), currentMode='normal', maxCount=10, session=[],idx=0,score=0,answered=false;
let hist=JSON.parse(localStorage.getItem('historyQuiz')||'{}');
function save(){localStorage.setItem('historyQuiz',JSON.stringify(hist));updateStats()}
function rec(id){return hist[id]||(hist[id]={seen:0,correct:0,wrong:0,star:false})}
function updateStats(){let a=Object.values(hist),seen=a.reduce((s,x)=>s+x.seen,0),ok=a.reduce((s,x)=>s+x.correct,0);done.textContent=seen;rate.textContent=seen?Math.round(ok/seen*100)+'%':'--';weak.textContent=a.filter(x=>x.wrong>x.correct).length}
function renderUnits(){units.forEach(u=>{let b=document.createElement('button');b.className='unit on';b.textContent='✓ '+u;b.onclick=()=>{selected.has(u)?selected.delete(u):selected.add(u);b.classList.toggle('on');b.textContent=(selected.has(u)?'✓ ':'')+u};document.querySelector('#units').appendChild(b)})}
function mode(b){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentMode=b.dataset.mode}
function count(b){document.querySelectorAll('.count').forEach(x=>x.classList.remove('on'));b.classList.add('on');maxCount=+b.dataset.count}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){let pool=Q.filter(q=>selected.has(q.unit));if(currentMode==='weak')pool=pool.filter(q=>{let r=hist[q.id];return r&&r.wrong>r.correct});if(currentMode==='star')pool=pool.filter(q=>hist[q.id]?.star);if(!pool.length){alert(currentMode==='normal'?'範囲を1つ以上選んでください':'該当する問題がまだありません');return}session=shuffle(pool).slice(0,maxCount);idx=0;score=0;home.classList.add('hidden');finish.classList.add('hidden');quiz.classList.remove('hidden');show()}
function show(){answered=false;let q=session[idx];qnum.textContent=`${idx+1} / ${session.length}`;unitLabel.textContent=q.unit;question.textContent=q.q;bar.style.width=(idx/session.length*100)+'%';feedback.classList.add('hidden');choices.innerHTML='';shuffle(q.choices).forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c);choices.appendChild(b)});starBtn.textContent=(hist[q.id]?.star?'★':'☆')+' あとで復習'}
function answer(btn,c){if(answered)return;answered=true;let q=session[idx],r=rec(q.id);r.seen++;if(c===q.answer){r.correct++;score++;btn.classList.add('correct');result.textContent='⭕ 正解！'}else{r.wrong++;btn.classList.add('wrong');[...choices.children].find(x=>x.textContent===q.answer)?.classList.add('correct');result.textContent='❌ おしい！'}answer.textContent='答え：'+q.answer;feedback.classList.remove('hidden');save()}
function toggleStar(){let q=session[idx],r=rec(q.id);r.star=!r.star;save();starBtn.textContent=(r.star?'★':'☆')+' あとで復習'}
function next(){idx++;if(idx>=session.length){quiz.classList.add('hidden');finish.classList.remove('hidden');finishText.textContent=`${session.length}問中 ${score}問正解（正答率 ${Math.round(score/session.length*100)}%）`}else show()}
function goHome(){quiz.classList.add('hidden');finish.classList.add('hidden');home.classList.remove('hidden');updateStats()}
function resetData(){if(confirm('学習記録と苦手データをすべて消しますか？')){hist={};save()}}
renderUnits();updateStats();
</script></body></html>
