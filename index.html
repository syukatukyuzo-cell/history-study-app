er": "多文化共生", "choices": ["多文化共生", "全会一致", "国際競争", "天皇主権"], "type": "choice", "explanation": "互いの文化の違いを尊重して生活することを目指します。"}, {"id": "civics-26", "subject": "civics", "unit": "生活・文化", "page": "6–7", "q": "言語・性別・障がいの有無などにかかわらず、誰もが使いやすい設計は？", "answer": "ユニバーサルデザイン", "choices": [], "type": "written", "explanation": "施設や製品を、さまざまな人が使いやすいよう工夫します。"}, {"id": "civics-27", "subject": "civics", "unit": "生活・文化", "page": "6–7", "q": "7歳・5歳・3歳になった子どもの成長を祝う行事は？", "answer": "七五三", "choices": ["七五三", "節分", "お盆", "端午の節句"], "type": "choice", "explanation": "子どもの成長を祝って神社に参拝する行事です。"}, {"id": "civics-28", "subject": "civics", "unit": "生活・文化", "page": "6–7", "q": "豆をまいて災厄をはらう年中行事は？", "answer": "節分", "choices": [], "type": "written", "explanation": "教材の年中行事の表で確認できます。"}, {"id": "civics-29", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "意見や利害が異なる人々の間で生じる状態は？", "answer": "対立", "choices": ["対立", "合意", "公正", "効率"], "type": "choice", "explanation": "社会生活では考え方の違いから対立が生まれます。"}, {"id": "civics-30", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "話し合いなどで、互いが納得する結論に達することは？", "answer": "合意", "choices": [], "type": "written", "explanation": "対立を解決する際は、効率と公正も考えます。"}, {"id": "civics-31", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "物やお金、時間などの無駄を省いているかという見方は？", "answer": "効率", "choices": ["効率", "公正", "権利", "全会一致"], "type": "choice", "explanation": "限られた資源を無駄なく使えているかを考えます。"}, {"id": "civics-32", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "手続き・機会・結果が公平かどうかという見方は？", "answer": "公正", "choices": [], "type": "written", "explanation": "一部の人だけが不利になっていないかを確かめます。"}, {"id": "civics-33", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "全員の賛成で決定する方法は？", "answer": "全会一致", "choices": ["全会一致", "多数決", "国際分業", "三権分立"], "type": "choice", "explanation": "全員が納得できる一方、時間がかかる場合があります。"}, {"id": "civics-34", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "より多くの人が賛成する案を選ぶ方法は？", "answer": "多数決", "choices": [], "type": "written", "explanation": "限られた時間で決めやすい一方、少数意見への配慮が必要です。"}, {"id": "civics-35", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "多数決で決めるときにも尊重するべき意見は？", "answer": "少数意見", "choices": ["少数意見", "多数派の意見だけ", "議長の意見だけ", "欠席者以外の意見だけ"], "type": "choice", "explanation": "少数意見を無視せず、十分に聞く場が必要です。"}, {"id": "civics-36", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "全会一致の短所を、時間に着目して説明しよう。", "answer": "全員が納得するまでに時間がかかることがある。", "choices": [], "type": "written", "explanation": "全員の意見が一致するまで、話し合いが長くなる場合があります。"}, {"id": "civics-37", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "「家を借りて住める」という契約上の立場は、権利と義務のどちら？", "answer": "権利", "choices": ["権利", "義務", "対立", "多数決"], "type": "choice", "explanation": "権利は認められていること、義務はしなければならないことです。"}, {"id": "civics-38", "subject": "civics", "unit": "現代社会の見方", "page": "6–9", "q": "契約で定められた家賃を支払うことは、権利と義務のどちら？", "answer": "義務", "choices": [], "type": "written", "explanation": "決まりに従って果たさなければならないことが義務です。"}, {"id": "civics-39", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "1689年のイギリスで、国王の権限を制限した文書は？", "answer": "権利章典", "choices": ["権利章典", "独立宣言", "人権宣言", "世界人権宣言"], "type": "choice", "explanation": "国王が議会の同意なしに法律の効力を止めることなどを否定しました。"}, {"id": "civics-40", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "1776年に出されたアメリカの宣言は？", "answer": "独立宣言", "choices": [], "type": "written", "explanation": "人間が平等につくられ、生まれながらの権利を持つという考えを示しました。"}, {"id": "civics-41", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "1789年にフランスで出された宣言は？", "answer": "人権宣言", "choices": ["人権宣言", "独立宣言", "権利章典", "ポツダム宣言"], "type": "choice", "explanation": "自由や平等などの権利を示した宣言です。"}, {"id": "civics-42", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "1919年に社会権を認めたドイツの憲法は？", "answer": "ワイマール憲法", "choices": [], "type": "written", "explanation": "すべての人に人間に値する生活を保障する考えを示しました。"}, {"id": "civics-43", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "1948年、人権の国際的保障を目指して出された宣言は？", "answer": "世界人権宣言", "choices": ["世界人権宣言", "独立宣言", "人権宣言", "日ソ共同宣言"], "type": "choice", "explanation": "人権の保障は、一国だけでなく国際社会の課題となりました。"}, {"id": "civics-44", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "『統治二論』で抵抗権を主張した思想家は？", "answer": "ロック", "choices": [], "type": "written", "explanation": "教材ではイギリスの思想家として紹介されています。"}, {"id": "civics-45", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "『社会契約論』で人民主権を主張した思想家は？", "answer": "ルソー", "choices": ["ルソー", "ロック", "モンテスキュー", "マッカーサー"], "type": "choice", "explanation": "政治のあり方を人々の側から考える思想です。"}, {"id": "civics-46", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "『法の精神』で三権分立を主張した思想家は？", "answer": "モンテスキュー", "choices": [], "type": "written", "explanation": "権力の集中を防ぐ仕組みを考えました。"}, {"id": "civics-47", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "権力を法で制限し、人権を保障する考え方は？", "answer": "法の支配", "choices": ["法の支配", "人の支配", "天皇主権", "国際分業"], "type": "choice", "explanation": "権力者が思いのままに政治を行うことを防ぎます。"}, {"id": "civics-48", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "憲法によって政治権力を制限する考え方は？", "answer": "立憲主義", "choices": [], "type": "written", "explanation": "憲法で権力を制限することが、人権の保障につながります。"}, {"id": "civics-49", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "国の法の中で、最上位に位置する法は？", "answer": "憲法", "choices": ["憲法", "法律", "条例", "命令"], "type": "choice", "explanation": "教材の法の構成図では、憲法が一番上にあります。"}, {"id": "civics-50", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "大日本帝国憲法が発布された年は？", "answer": "1889年", "choices": [], "type": "written", "explanation": "教材では1889年2月11日と示されています。"}, {"id": "civics-51", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "大日本帝国憲法では、主権を持っていたのは誰？", "answer": "天皇", "choices": ["天皇", "国民", "国会", "内閣"], "type": "choice", "explanation": "日本国憲法の国民主権との違いを確認しましょう。"}, {"id": "civics-52", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "日本国憲法が公布された年月日は？", "answer": "1946年11月3日", "choices": [], "type": "written", "explanation": "公布は、成立した憲法を広く知らせることです。"}, {"id": "civics-53", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "国会・内閣・裁判所に国の権力を分ける仕組みは？", "answer": "三権分立（権力分立）", "choices": ["三権分立（権力分立）", "全会一致", "国際分業", "社会保障"], "type": "choice", "explanation": "権力の集中を防ぎ、国民の人権を守ります。"}, {"id": "civics-54", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "法律を制定する国会の権力は？", "answer": "立法権", "choices": [], "type": "written", "explanation": "国会は立法、内閣は行政、裁判所は司法を担います。"}, {"id": "civics-55", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "内閣が担う国の権力は？", "answer": "行政権", "choices": ["行政権", "立法権", "司法権", "抵抗権"], "type": "choice", "explanation": "国の権力を別々の機関に分ける仕組みの一つです。"}, {"id": "civics-56", "subject": "civics", "unit": "人権の歴史・憲法", "page": "10–11・14–15", "q": "裁判所が担う国の権力は？", "answer": "司法権", "choices": [], "type": "written", "explanation": "裁判所は裁判を行う司法を担います。"}, {"id": "civics-57", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "日本国憲法の三つの基本原理をすべて挙げよう。", "answer": "国民主権・基本的人権の尊重・平和主義", "choices": [], "type": "written", "explanation": "主権、人権、平和の三つをまとめて覚えましょう。"}, {"id": "civics-58", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "国の政治のあり方を最終的に決める権力が国民にあることは？", "answer": "国民主権", "choices": [], "type": "written", "explanation": "日本国憲法の三つの基本原理の一つです。"}, {"id": "civics-59", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "選挙で選ばれた代表者が国会で政治を決定する制度は？", "answer": "議会制民主主義", "choices": ["議会制民主主義", "直接民主主義", "天皇主権", "全会一致"], "type": "choice", "explanation": "国民が選んだ代表者を通して政治に参加する仕組みです。"}, {"id": "civics-60", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "日本国憲法で、天皇は日本国と日本国民統合の何とされる？", "answer": "象徴", "choices": [], "type": "written", "explanation": "日本国憲法では主権は国民にあります。"}, {"id": "civics-61", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "天皇が憲法に定められた形式的・儀礼的な行為を行うことは？", "answer": "国事行為", "choices": ["国事行為", "国民投票", "三権分立", "社会参画"], "type": "choice", "explanation": "国会の召集や法律の公布などが教材の例です。"}, {"id": "civics-62", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "天皇の国事行為に助言と承認を行う機関は？", "answer": "内閣", "choices": [], "type": "written", "explanation": "天皇が内閣の助言と承認により行います。"}, {"id": "civics-63", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "憲法改正の発議には、各議院の総議員のどれだけの賛成が必要？", "answer": "3分の2以上", "choices": ["3分の2以上", "過半数", "3分の1以上", "全員"], "type": "choice", "explanation": "衆議院と参議院の両方で、それぞれ3分の2以上が必要です。"}, {"id": "civics-64", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "憲法改正の国民投票では、有効投票のどれだけの賛成が必要？", "answer": "過半数", "choices": [], "type": "written", "explanation": "国会の発議の条件と、国民投票の承認の条件を区別しましょう。"}, {"id": "civics-65", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "憲法改正の手続きが普通の法律より慎重なのはなぜ？", "answer": "憲法が国の最高法規だから。", "choices": [], "type": "written", "explanation": "国の政治の基本を定める最上位の法なので、慎重な手続きが必要です。"}, {"id": "civics-66", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "戦争の放棄などを定める日本国憲法の条文は第何条？", "answer": "第9条", "choices": [], "type": "written", "explanation": "平和主義に関係する条文です。"}, {"id": "civics-67", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "憲法第9条第2項では、陸海空軍その他の何を保持しないと定める？", "answer": "戦力", "choices": ["戦力", "国会", "法律", "文化"], "type": "choice", "explanation": "教材の条文では、戦力の不保持と交戦権の否認を確認します。"}, {"id": "civics-68", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "憲法第9条第2項で、国の何を認めないと定めている？", "answer": "交戦権", "choices": [], "type": "written", "explanation": "条文の用語を正確に確認しましょう。"}, {"id": "civics-69", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "核兵器を「持たず、作らず、持ちこませず」とする原則は？", "answer": "非核三原則", "choices": ["非核三原則", "三権分立", "国民主権", "全会一致"], "type": "choice", "explanation": "三つとも核兵器についての原則です。"}, {"id": "civics-70", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "1954年に発足した、日本の国土の防衛を主な目的とする組織は？", "answer": "自衛隊", "choices": [], "type": "written", "explanation": "教材の日本の安全保障の年表に示されています。"}, {"id": "civics-71", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "1951年、日本がアメリカと結んだ安全保障に関する条約は？", "answer": "日米安全保障条約", "choices": ["日米安全保障条約", "日韓基本条約", "日中平和友好条約", "日ソ中立条約"], "type": "choice", "explanation": "教材では日米安保条約という略称でも出てきます。"}, {"id": "civics-72", "subject": "civics", "unit": "三つの基本原理", "page": "12–15", "q": "国連の平和維持活動の略称は？", "answer": "PKO", "choices": [], "type": "written", "explanation": "停戦や選挙の監視などが教材で挙げられています。"}, {"id": "civics-73", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "表現や信仰などの自由を保障する権利は？", "answer": "自由権", "choices": ["自由権", "社会権", "平等権", "交戦権"], "type": "choice", "explanation": "自由に考えたり行動したりすることを保障します。"}, {"id": "civics-74", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "人間らしい生活を保障する権利は？", "answer": "社会権", "choices": [], "type": "written", "explanation": "貧富の差の拡大などを背景に保障が進みました。"}, {"id": "civics-75", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "身分などによる差別を否定する権利は？", "answer": "平等権", "choices": ["平等権", "自由権", "立法権", "行政権"], "type": "choice", "explanation": "基本的人権は法の下の平等に基づきます。"}, {"id": "civics-76", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "一人ひとりをかけがえのない存在として大切にする考え方は？", "answer": "個人の尊重", "choices": [], "type": "written", "explanation": "教材では基本的人権を支える考え方として示されています。"}, {"id": "civics-77", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "「すべて国民は、（　）の下に平等である。」空欄に入る言葉は？", "answer": "法", "choices": ["法", "天皇", "内閣", "多数派"], "type": "choice", "explanation": "憲法第14条第1項の、法の下の平等を示す言葉です。"}, {"id": "civics-78", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "1989年に国連で採択された、子どもの人権に関する条約は？", "answer": "子ども（児童）の権利条約", "choices": [], "type": "written", "explanation": "子どもの人権も国際的に保障されます。"}, {"id": "civics-79", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "三権分立を採用する目的を「権力」「人権」を使って説明しよう。", "answer": "権力の集中を防ぎ、国民の人権を守るため。", "choices": [], "type": "written", "explanation": "国の権力を分けることが、権力の濫用を防ぐことにつながります。"}, {"id": "civics-80", "subject": "civics", "unit": "基本的人権", "page": "10–15", "q": "社会権が求められるようになった背景を、貧富の差に着目して説明しよう。", "answer": "資本主義経済が発達する中で、貧富の差が広がったため。", "choices": [], "type": "written", "explanation": "低賃金で働く労働者などの、人間らしい生活を保障する必要がありました。"}];
const $=id=>document.getElementById(id);
let subject='history',session=[],idx=0,chosen=null,revealed=false,graded=false,outcomes=[],records={};
const selections=Object.fromEntries(['history','civics'].map(s=>[s,new Set(Q.filter(q=>q.subject===s).map(q=>q.unit))]));
function warning(message){$('storageNotice').hidden=false;$('storageNotice').textContent=message;}
for(const [s,key] of [['history','historyQuiz'],['civics','civicsQuiz']]){try{const value=JSON.parse(localStorage.getItem(key)||'{}');records[s]=value&&typeof value==='object'&&!Array.isArray(value)?value:{};}catch{records[s]={};warning('保存済みの記録を読み込めませんでした。この回の学習は続けられます。');}}
function rec(q){const data=records[q.subject][q.id];if(!data||typeof data!=='object')records[q.subject][q.id]={seen:0,correct:0,wrong:0,star:false};const r=records[q.subject][q.id];for(const k of ['seen','correct','wrong'])if(!Number.isFinite(r[k])||r[k]<0)r[k]=0;return r;}
function isWeak(q){const r=rec(q);return typeof r.weak==='boolean'?r.weak:r.wrong>r.correct;}
function save(){try{localStorage.setItem(subject==='history'?'historyQuiz':'civicsQuiz',JSON.stringify(records[subject]));}catch{warning('このブラウザでは記録を保存できません。ページを閉じると今回の記録は失われます。');}}
function bank(){return Q.filter(q=>q.subject===subject);}
function pool(){return bank().filter(q=>selections[subject].has(q.unit)&&($('format').value==='mixed'||q.type===$('format').value)&&($('mode').value==='normal'||($('mode').value==='weak'?isWeak(q):rec(q).star)));}
function updatePool(){$('poolCount').textContent=`条件に合う問題：${pool().length}問`;$('notice').textContent='';}
function home(){session=[];$('home').hidden=false;$('quiz').hidden=true;$('finish').hidden=true;renderHome();}
function renderHome(){const a=bank(),seen=a.reduce((s,q)=>s+rec(q).seen,0),correct=a.reduce((s,q)=>s+rec(q).correct,0);$('done').textContent=seen;$('rate').textContent=seen?Math.round(correct/seen*100)+'%':'—';$('weak').textContent=a.filter(isWeak).length;$('bankInfo').textContent=`${subject==='history'?'歴史':'公民'} ${a.length}問 ／ ふりかえる ${a.filter(q=>rec(q).star).length}問`;$('format').options[2].disabled=subject==='history';if(subject==='history'&&$('format').value==='written')$('format').value='mixed';$('units').replaceChildren();for(const unit of new Set(a.map(q=>q.unit))){const b=document.createElement('button');b.className='unit';b.setAttribute('aria-pressed',selections[subject].has(unit));b.textContent=(selections[subject].has(unit)?'✓ ':'')+unit+`（${a.filter(q=>q.unit===unit).length}問）`;b.onclick=()=>{selections[subject].has(unit)?selections[subject].delete(unit):selections[subject].add(unit);renderHome();};$('units').append(b);}updatePool();}
function shuffle(input){const a=[...input];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(items){session=shuffle(items);idx=0;outcomes=[];$('home').hidden=true;$('finish').hidden=true;$('quiz').hidden=false;show();}
function show(){chosen=null;revealed=false;graded=false;const q=session[idx];$('qnum').textContent=`${idx+1} / ${session.length}`;$('bar').style.width=`${idx/session.length*100}%`;$('unitLabel').textContent=`${subject==='history'?'歴史':'公民'} › ${q.unit} ／ ${q.type==='choice'?'4択':'記述・穴埋め'}${q.page?' ／ 教材 p.'+q.page:''}`;$('question').textContent=q.q;$('feedback').hidden=true;$('reveal').hidden=false;$('reveal').setAttribute('aria-expanded','false');$('written').hidden=q.type!=='written';$('memo').value='';$('memo').readOnly=false;$('choices').replaceChildren();$('result').textContent='';$('selfGrade').hidden=true;for(const c of shuffle(q.choices)){const b=document.createElement('button');b.className='choice';b.textContent=c;b.setAttribute('aria-pressed','false');b.onclick=()=>{if(revealed)return;chosen=c;for(const el of $('choices').children){el.classList.toggle('selected',el===b);el.setAttribute('aria-pressed',el===b);}};$('choices').append(b);}updateReview();$('question').focus();}
function updateReview(){const on=!!rec(session[idx]).star;$('review').textContent=on?'★ ふりかえるに保存済み（解除）':'☆ ふりかえるに保存';$('review').setAttribute('aria-pressed',on);}
function grade(correct){if(graded||!revealed)return;graded=true;const q=session[idx],r=rec(q);r.seen++;r.correct+=correct?1:0;r.wrong+=correct?0:1;r.weak=!correct;outcomes[idx]=correct;$('result').textContent=correct?'○ 正解！':'もう一度やってみよう。「苦手」に登録しました。';$('selfGrade').hidden=true;$('next').textContent=idx===session.length-1?'結果を見る':'次の問題 →';save();}
$('reveal').onclick=()=>{if(revealed)return;revealed=true;const q=session[idx];$('reveal').hidden=true;$('reveal').setAttribute('aria-expanded','true');$('feedback').hidden=false;$('answerLabel').textContent=q.type==='written'?'解答例':'正解';$('answer').textContent=q.answer;$('explanation').textContent=q.explanation;$('memo').readOnly=true;for(const b of $('choices').children){b.disabled=true;b.classList.toggle('correct',b.textContent===q.answer);b.classList.toggle('wrong',b.textContent===chosen&&chosen!==q.answer);}if(q.type==='choice'&&chosen!==null)grade(chosen===q.answer);else{$('selfGrade').hidden=false;$('next').textContent='採点せずに次へ';}};
$('gotIt').onclick=()=>grade(true);$('missed').onclick=()=>grade(false);
$('review').onclick=()=>{const r=rec(session[idx]);r.star=!r.star;save();updateReview();};
$('next').onclick=()=>{if(!revealed)return;if(++idx<session.length)show();else{const n=outcomes.filter(x=>typeof x==='boolean').length,correct=outcomes.filter(x=>x===true).length;$('quiz').hidden=true;$('finish').hidden=false;$('finishText').textContent=`${session.length}問を学習。採点した${n}問中、${correct}問正解${n?'（'+Math.round(correct/n*100)+'%）':''}。`;$('finishHint').textContent=`未採点 ${session.length-n}問。未採点の問題は正答率・苦手の記録に含めません。`;$('retry').hidden=!outcomes.some(x=>x===false);}};
$('retry').onclick=()=>begin(session.filter((q,i)=>outcomes[i]===false));
$('start').onclick=()=>{const items=pool();if(!items.length){$('notice').textContent='該当する問題がありません。範囲・モード・形式を変更してください。';return;}let chosenItems=shuffle(items).slice(0,Number($('count').value));if($('format').value==='mixed'&&chosenItems.length>1){for(const type of ['choice','written'])if(items.some(q=>q.type===type)&&!chosenItems.some(q=>q.type===type))chosenItems[chosenItems.length-1]=shuffle(items.filter(q=>q.type===type))[0];}begin(chosenItems);};
for(const id of ['mode','format','count'])$(id).onchange=updatePool;
$('selectAll').onclick=()=>{selections[subject]=new Set(bank().map(q=>q.unit));renderHome();};$('selectNone').onclick=()=>{selections[subject].clear();renderHome();};
for(const b of document.querySelectorAll('[data-subject]'))b.onclick=()=>{subject=b.dataset.subject;for(const el of document.querySelectorAll('[data-subject]'))el.setAttribute('aria-pressed',el===b);home();};
$('exit').onclick=home;$('finishHome').onclick=home;$('reset').onclick=()=>{if(confirm(`${subject==='history'?'歴史':'公民'}の学習記録・苦手・ふりかえるを削除しますか？`)){records[subject]={};save();renderHome();}};
renderHome();
</script></body></html>
